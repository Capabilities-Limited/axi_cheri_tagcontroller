name: "CHERI tag controller tests"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix develop --command bash -c "make clean"
    - run: nix develop --command bash -c "make verilate COVERAGE=1"
    - run: nix develop --command bash -c "make runtests"
