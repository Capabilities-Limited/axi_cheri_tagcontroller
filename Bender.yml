package:
  name: axi_tag_ctrl
  authors:
    - "Bruno Sá <bruno.vilaca.sa@gmail.com>" # current maintainer

dependencies:
  hpdcache: { git: "https://github.com/Capabilities-Limited/cv-hpdcache.git", rev: "cva6-zcheri-support" }
  axi: { git: "https://github.com/pulp-platform/axi.git", rev: "697f13ff67153a5243e347f2d1992a125018b6c2" }
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git", version: "1.32.0" }
  common_verification: { git: "https://github.com/pulp-platform/common_verification.git", version: "0.2.0" }
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git", version: "0.3.6" }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: "0.2.9" }

sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this
  # package. Files in level 1 only depend on files in level 0, files in level 2 on files in
  # levels 1 and 0, etc. Files within a level are ordered alphabetically.
  # Level 0
  - src/axi_tagctrl_pkg.sv
  - src/axi_tagctrl_config.sv
  - src/tag_lookup_engine/tag_lookup_engine.sv
  - src/tag_lookup_engine/tag_lookup_engine_root_init.sv
  - src/tag_lookup_engine/tag_lookup_engine_hpdcache_configs.sv
  - src/tag_lookup_engine/tag_lookup_engine_hpdcache_wrapper.sv
  - src/tag_lookup_engine/tag_lookup_engine_hpdcache_read_req_rsp_wrapper.sv
  - src/tag_lookup_engine/tag_lookup_engine_hpdcache_write_req_rsp_wrapper.sv

  - src/tag_lookup_engine/tag_lookup_engine_table_lookups.sv
  - src/tag_lookup_engine/tag_lookup_engine_table_lookups_read.sv
  - src/tag_lookup_engine/tag_lookup_engine_table_lookups_write.sv
  # Level 1
  - src/axi_tagc_read_unit.sv
  - src/axi_tagc_write_unit.sv
  - src/axi_tagctrl_ax.sv
  - src/axi_tagctrl_r.sv
  - src/axi_tagctrl_w.sv
  # Level 2
  - src/axi_tagctrl_top.sv


  - target: tb
    include_dirs:
      - tb
    files:
      # Level 0:
      - test/hdl/tc_sram_wrapper.sv
      - test/hdl/sram.sv
      - test/hdl/axi2mem.sv
      - test/hdl/tag_ctrl_testharness.sv


  - target: all(tb, coverage)
    include_dirs:
      - cov
    files:
      - cov/tag_lookup_engine/tag_lookup_engine_root_init_cov.sv
      - cov/tag_lookup_engine/tag_lookup_engine_table_lookups_read_cov.sv
      - cov/tag_lookup_engine/tag_lookup_engine_table_lookups_write_cov.sv
